name: Synchroniser le site du cabinet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-site.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Télécharger la version en ligne du site
        run: |
          curl --fail --silent --show-error --location \
            "https://zuduxergikwysupesdep.supabase.co/functions/v1/cabinet-rhodes" \
            --output index.html
          test -s index.html

      - name: Enregistrer le site dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Publier le site du Cabinet Médical de Rhodes"
            git push
          fi
